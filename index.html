<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JRA HORSE DATA LAB</title>
<style>body{margin:auto;padding:18px;max-width:850px;background:#101827;color:#edf2f8;font:16px system-ui}h1{font-size:1.5rem}.panel{background:#1b293d;border:1px solid #40516a;border-radius:14px;padding:16px;margin:16px 0}.muted{color:#aab8c9}a{color:#91caff;overflow-wrap:anywhere}.item{padding:10px 0;border-bottom:1px solid #40516a}</style></head><body>
<h1>JRA HORSE DATA LAB</h1><p class="muted">JRA公式データ分析基盤・開発中</p>
<section class="panel"><h2>公式データ更新状況</h2><p id="status">読み込み中…</p><div id="items"></div></section>
<section class="panel"><h2>分析機能</h2><ul><li>レースラップ・前後半3F/5F：未実装</li><li>上がり3F・通過順位：未実装</li><li>テン速度・位置取り能力：未実装</li><li>トラックバイアス・不利補正：未実装</li><li>調教・初ブリンカー検出：未実装</li></ul><p class="muted">現在は公式PDFリンク一覧のみ。レース全体ラップと個別馬ラップを混同しません。</p></section>
<script>fetch('./data/catalog.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{document.getElementById('status').textContent='確認日時: '+d.checked_at+' / PDFリンク: '+d.items.length;const b=document.getElementById('items');d.items.forEach(x=>{const p=document.createElement('p');p.className='item';const a=document.createElement('a');a.href=x.url;a.textContent=x.label+' ('+x.year+')';a.target='_blank';a.rel='noopener';p.append(a);b.append(p)})}).catch(()=>document.getElementById('status').textContent='更新データはまだありません。GitHub Actionsを実行してください。');</script></body></html>
