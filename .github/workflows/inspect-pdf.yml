name: Inspect JRA result PDF
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: python -m pip install --upgrade pymupdf
      - name: Inspect one official result PDF
        run: |
          python pdf_probe.py \
            --url "https://www.jra.go.jp/datafile/seiseki/report/2026/2026-5tokyo2.pdf" \
            --output data/pdf_probe.json
      - name: Upload extraction report
        uses: actions/upload-artifact@v4
        with:
          name: jra-pdf-inspection
          path: data/pdf_probe.json
          if-no-files-found: error
