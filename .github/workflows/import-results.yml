name: Import JRA race results

concurrency:
  # Share one lock with the HTML sidecar importer: both write to the same main branch.
  group: jra-official-data-imports
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-results.yml
      - jra_pdf_parser.py
      - import_results.py
      - tests/**
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of official PDFs to import in this run"
        required: true
        default: "3"
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests before import
        run: python -m unittest discover -s tests -v
      - name: Install PDF and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-jpn
          python -m pip install Pillow
      - name: Update branch before importing
        run: git pull --rebase origin main
      - name: Import official results
        env:
          JRA_OCR_DEBUG_DIR: ocr-debug
        run: python import_results.py --limit "${{ inputs.limit || '3' }}"
      - name: Upload OCR layout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-ocr-layout-diagnostics
          path: ocr-debug/
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit imported records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race_results.json
          git diff --cached --quiet || git commit -m "Import JRA race results"
          # Catalog and other independent data updates can land while OCR runs.
          # Rebase the completed data commit onto the latest main before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
